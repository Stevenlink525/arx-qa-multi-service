version: "1.0"

metadata:
  id: apps.qa-multi-service
  name: QA Multi Service
  version: 1.0.0
  releaseDate: 2026-09-03
  type: apps
  categories:
    - Testing
  subtitle: QA fixture exposing several node ports and desktop shortcuts
  description: >
    A QA test fixture that declares multiple NodePort services and multiple
    desktop shortcuts on top of the n8n chart. Used to verify the System
    Service table's per-port rows and the desktop shortcut's Other Services
    menu. Not intended for production use.
  icon: ./icon.svg
  developer:
    name: ARX QA
    url: https://github.com/ardge-labs
  supportedLanguages:
    - en-US
  tags:
    - testing
    - fixture

resources:
  cpu: "0.5"
  memory: "512Mi"
  storage: "10Gi"
  gpu: 0
  vram: null

deployment:
  type: helm
  helmRepository:
    type: oci
    name: n8n-helm-chart
    url: oci://8gears.container-registry.com/library
  helmChart:
    chart: n8n
    version: "2.0.1"
    valuesFiles:
      - manifests/values.yaml
