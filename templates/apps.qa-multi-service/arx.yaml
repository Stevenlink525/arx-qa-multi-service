apiVersion: arx.ardge.com/v1
kind: ArxBinding
spec:
  network:
    services:
      http:
        type: NodePort
        ports:
          - port: 5678
            displayName: Workflows
      admin:
        type: NodePort
        ports:
          - port: 5678
            displayName: Console
      creds:
        type: NodePort
        ports:
          - port: 5678
            displayName: Credentials
      exec:
        type: NodePort
        ports:
          - port: 5678
      metrics:
        type: NodePort
        ports:
          - port: 5678
      # SV-006 probe: GatewayAPI is the third and last non-NodePort type. #527
      # states handler.go returns ErrNotImplemented for GatewayAPI as well as
      # LoadBalancer, so this is here to confirm that by measurement.
      internal:
        type: GatewayAPI
        route:
          port: 5678
          protocol: http
          displayName: Internal
  desktop:
    shortcuts:
      - label: qa-main
        open:
          - iframe
          - newtab
        serviceRef: http
        scheme: http
        path: /
      - label: qa-admin
        open:
          - iframe
          - newtab
        serviceRef: admin
        scheme: http
        path: /settings/personal
      - label: qa-creds
        open:
          - iframe
        serviceRef: creds
        scheme: http
        path: /home/credentials
      - label: qa-exec
        open:
          - newtab
        serviceRef: exec
        scheme: http
        path: /home/executions
